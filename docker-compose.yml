version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spatialverse-cmms-db
    environment:
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: cmms_dev_password
      POSTGRES_DB: spatialverse_cmms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmms -d spatialverse_cmms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spatialverse-cmms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
